<text x="83" y="356" font-size="16">Fixed base and motor</text>
<text x="341" y="365" font-size="16">Start: hanging down</text>
<text x="621" y="129" font-size="19" font-weight="bold">Recover → swing up → balance</text>
<text x="621" y="168" font-size="16">θ: arm rotation about +z</text>
<text x="621" y="198" font-size="16">α: pendulum rotation about local +x</text>
<text x="621" y="228" font-size="16">α = 0: upright • α = π: hanging down</text>
<text x="621" y="275" font-size="16">The hinge is radial, along the arm.</text>
<text x="621" y="302" font-size="16">The pendulum swings out of this view.</text>
